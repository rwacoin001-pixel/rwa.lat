<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>dev login</title></head>
<body>
<script>
// dev-only helper: performs a REAL demo login via the proxied API, stores the token,
// sets session + theme, then jumps to the target page.
var params = new URLSearchParams(location.search);
var to = params.get('to') || '/home';
var theme = params.get('theme');
try {
  if (theme === 'dark' || theme === 'light') {
    localStorage.setItem('rwa-app-theme', theme);
    localStorage.setItem('rwa-home-theme', theme);
  }
} catch (e) {}

fetch('/v1/auth/demo/login', {
  method: 'POST',
  headers: { 'Content-Type': 'application/json' },
  body: JSON.stringify({ email: 'demo@user.a-reit.com' })
})
  .then(function (r) { return r.json(); })
  .then(function (d) {
    try {
      if (d && d.token) localStorage.setItem('auth_token', d.token);
      localStorage.setItem('rwa-session-mode', 'authenticated');
    } catch (e) {}
    location.replace(to);
  })
  .catch(function () {
    try { localStorage.setItem('rwa-session-mode', 'authenticated'); } catch (e) {}
    location.replace(to);
  });
</script>
</body></html>
