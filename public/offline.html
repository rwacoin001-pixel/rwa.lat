<!doctype html>
<html lang="en">
  <head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#000000"><title>RWA.LAT</title><style>
    :root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;min-height:100dvh;padding:max(24px,env(safe-area-inset-top)) 18px max(24px,env(safe-area-inset-bottom));display:grid;place-items:center;background:radial-gradient(circle at 80% 10%,rgba(47,230,191,.14),transparent 34%),#020405;color:#f4fbfa;font:16px/1.45 Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}main{width:min(100%,390px);position:relative;overflow:hidden;padding:34px 24px 27px;border:1px solid rgba(200,231,229,.2);border-radius:30px;background:linear-gradient(145deg,rgba(15,29,32,.9),rgba(5,10,12,.94));box-shadow:inset 0 1px rgba(255,255,255,.15),0 28px 80px rgba(0,0,0,.62);text-align:center}main:before{content:"";width:190px;height:190px;position:absolute;right:-84px;top:-120px;border-radius:50%;background:rgba(47,230,191,.18);filter:blur(36px)}.mark{width:80px;height:80px;display:grid;place-items:center;margin:0 auto 22px;border:1px solid rgba(47,230,191,.4);border-radius:24px;background:rgba(47,230,191,.06);box-shadow:0 0 28px rgba(47,230,191,.13)}.mark img{width:49px;height:49px;object-fit:contain}.eyebrow{position:relative;margin:0;color:#2fe6bf;letter-spacing:.16em;font-size:11px;font-weight:700}.status{position:relative;display:inline-flex;align-items:center;gap:7px;margin:18px 0 0;padding:6px 10px;border:1px solid rgba(47,230,191,.26);border-radius:999px;color:#8ba0a3;font-size:10px}.status i{width:6px;height:6px;border-radius:50%;background:#f2b15a;box-shadow:0 0 8px rgba(242,177,90,.8)}h1{position:relative;font-size:31px;line-height:1.04;letter-spacing:-.06em;margin:18px 0 10px}#body{position:relative;margin:0;color:#8ba0a3;font-size:13px;line-height:1.55}.link{position:relative;display:inline-flex;align-items:center;justify-content:center;min-height:46px;margin-top:24px;padding:0 22px;border:1px solid rgba(196,255,238,.8);border-radius:999px;color:#03211a;background:#2fe6bf;font-size:13px;font-weight:700;text-decoration:none;box-shadow:inset 0 2px rgba(255,255,255,.45),0 10px 24px rgba(0,0,0,.3)}
  </style></head>
  <body><main><div class="mark"><img src="/rwa-mark.svg" alt="RWA.LAT"></div><p class="eyebrow">RWA.LAT</p><span class="status"><i></i><span id="status">Offline mode</span></span><h1 id="title">You’re offline.</h1><p id="body">Your saved pages remain available. Reconnect to refresh market data.</p><a class="link" href="/home" id="link">Open saved home</a></main>
    <script>
      const copy={zh:['当前处于离线状态','已保存的页面仍可浏览；重新联网后可刷新市场数据。','离线模式','打开已保存首页'],hi:['आप ऑफ़लाइन हैं।','सहेजे गए पेज उपलब्ध हैं। बाज़ार डेटा ताज़ा करने के लिए दोबारा कनेक्ट करें।','ऑफ़लाइन मोड','सहेजा गया होम खोलें'],es:['Estás sin conexión.','Las páginas guardadas siguen disponibles. Vuelve a conectarte para actualizar los datos.','Modo sin conexión','Abrir inicio guardado'],ar:['أنت غير متصل بالإنترنت.','تظل الصفحات المحفوظة متاحة. أعد الاتصال لتحديث بيانات السوق.','وضع عدم الاتصال','فتح الصفحة الرئيسية المحفوظة'],fr:['Vous êtes hors ligne.','Les pages enregistrées restent disponibles. Reconnectez-vous pour actualiser les données.','Mode hors ligne','Ouvrir l’accueil enregistré'],pt:['Você está offline.','As páginas salvas continuam disponíveis. Reconecte-se para atualizar os dados.','Modo offline','Abrir início salvo']};
      const language=(navigator.language||'en').split('-')[0]; if(copy[language]){document.documentElement.lang=language;document.documentElement.dir=language==='ar'?'rtl':'ltr';document.getElementById('title').textContent=copy[language][0];document.getElementById('body').textContent=copy[language][1];document.getElementById('status').textContent=copy[language][2];document.getElementById('link').textContent=copy[language][3]}
    </script>
  </body>
</html>
