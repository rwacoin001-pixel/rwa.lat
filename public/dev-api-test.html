<!DOCTYPE html>
<html><head><meta charset="utf-8"><style>body{font:13px/1.6 monospace;background:#111;color:#eee;padding:20px;white-space:pre-wrap}</style></head>
<body>
<div id="out">testing…</div>
<script>
const token = window.localStorage.getItem('auth_token');
const log = [];
log.push('token: ' + (token ? token.slice(0, 24) + '…' : 'NONE'));
log.push('origin: ' + location.origin);
document.getElementById('out').textContent = log.join('\n');

async function test() {
  try {
    const r = await fetch('http://localhost:4000/v1/portfolio/positions', { headers: { Authorization: 'Bearer ' + token } });
    log.push('positions status: ' + r.status);
    const d = await r.json();
    log.push('positions body: ' + JSON.stringify(d).slice(0, 300));
  } catch (e) { log.push('positions ERR: ' + e.message); }
  try {
    const r2 = await fetch('http://localhost:4000/v1/wallet', { headers: { Authorization: 'Bearer ' + token } });
    log.push('wallet status: ' + r2.status);
    const d2 = await r2.json();
    log.push('wallet body: ' + JSON.stringify(d2).slice(0, 200));
  } catch (e) { log.push('wallet ERR: ' + e.message); }
  document.getElementById('out').textContent = log.join('\n');
}
test();
</script>
</body></html>
