<!doctype html>
<!--
  _dev-login.html — 一次性 dev 登录工具（临时·可随时删除）
  打开本页会以 demo 账号登录并跳转 /home。不参与产品视觉（S2 冻结令范围外的工具页）。
-->
<html>
<head><meta charset="utf-8"><title>Dev Login…</title></head>
<body style="background:#0a0b0d;color:#eee;font-family:system-ui;display:flex;align-items:center;justify-content:center;height:100vh;margin:0">
<div id="s">正在以 demo 账号登录…</div>
<script>
(async () => {
  try {
    const r = await fetch('/v1/auth/demo/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email: 'demo@user.rwa.lat', type: 'user' }),
    })
    const s = await r.json()
    if (!s || !s.token) throw new Error('no token: ' + JSON.stringify(s))
    localStorage.setItem('auth_token', s.token)
    localStorage.setItem('rwa-session-token', s.token)
    localStorage.setItem('rwa.session', JSON.stringify({ sessionToken: s.token, sessionId: s.sessionId, userId: s.userId, loggedInAt: new Date().toISOString() }))
    localStorage.setItem('rwa-session-mode', 'authenticated')
    location.replace('/home')
  } catch (e) {
    document.getElementById('s').textContent = '登录失败：' + e.message
  }
})()
</script>
</body>
</html>
