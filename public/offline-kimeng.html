<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>KIMENG</title>
<script>
  let theme
  try { theme = localStorage.getItem('rwa.theme') || localStorage.getItem('rwa-app-theme') } catch {}
  document.documentElement.dataset.theme = theme === 'dark' || theme !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
</script>
<style>
  :root { color-scheme: light; --paper: #f5f6f8; --ink: #121416; }
  :root[data-theme="dark"] { color-scheme: dark; --paper: #0a0c10; --ink: #f5f6f8; }
  [data-theme="dark"] img { filter: invert(1); }
  body { margin: 0; min-height: 100vh; min-height: 100dvh; display: grid; place-items: center; background: var(--paper); color: var(--ink); font: 16px/1.6 system-ui, sans-serif; }
  main { width: min(22rem, 84vw); text-align: center; }
  img { width: 112px; height: 112px; }
  h1 { font-size: 24px; margin: 16px 0 4px; }
  p { margin: 0 0 24px; }
  a { display: inline-grid; place-items: center; min-height: 48px; padding: 0 28px; border-radius: 24px; background: var(--ink); color: var(--paper); text-decoration: none; }
</style>
<main>
  <img src="/brand/kimeng/mark-light.svg" alt="KIMENG" width="112" height="112">
  <h1>当前处于离线状态</h1>
  <p>连接网络后可刷新行情、登录或操作账户。</p>
  <a href="/home">返回首页</a>
</main>
</html>
