packages:
  - apps/*
  - packages/*

allowBuilds:
  '@scarf/scarf': false
  esbuild: true
  msw: false
  protobufjs: true
  sharp: true
  unrs-resolver: true
  workerd: true

# Kept in sync with pnpm-lock.yaml. pnpm 11 reads workspace-wide overrides
# from this file rather than the deprecated package.json "pnpm" field.
overrides:
  hono: 4.12.34
  postcss: 8.5.23
  nanoid: 3.3.17
  brace-expansion: 5.0.9
  'minimatch@3>brace-expansion': 1.1.12
  'minimatch@8>brace-expansion': 2.0.2
  'minimatch@9>brace-expansion': 2.0.2
  js-yaml: 4.3.1
  body-parser: 2.3.0
  fast-uri: 3.1.5
  ip-address: 10.3.1
  sharp: 0.35.0
  '@hono/node-server': 2.0.10
